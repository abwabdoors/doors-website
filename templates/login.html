<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 350px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: #4f81bd;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            border: 2px solid #4f81bd;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        .login-box input:focus {
            border-color: #d4af37;
        }

        .login-box button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #d4af37;
            color: #111;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #e0bd45;
        }

        .error {
            color: red;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🔐 دخول الإدارة</h2>

    <form method="POST">

        <input
            type="password"
            name="code"
            placeholder="أدخل الرقم السري"
            required
            autofocus
        >

        <button type="submit">
            دخول
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
